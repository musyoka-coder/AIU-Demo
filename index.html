<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIU Innovation Hub | Concept Demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#142b29;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;background:#fff;border-bottom:1px solid #e4ece8;gap:12px}header strong{font-size:20px;color:#006c55}header span{font-size:11px;color:#657873}nav{display:flex;gap:9px;flex-wrap:wrap}button,.btn{background:#006c55;color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:650}button.secondary{background:#e7f2ed;color:#075c4c}button.ghost{background:transparent;color:#28665b;border:1px solid #c5d8d1}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1200px;margin:auto;padding:28px 20px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:stretch;margin:20px 0 35px}.heroText{background:linear-gradient(135deg,#004b40,#0b8266);color:#fff;border-radius:24px;padding:45px}.heroText h1{font-size:clamp(34px,4.2vw,58px);line-height:1.08;margin:12px 0}.heroText p{line-height:1.7;color:#dbf5eb}.eyebrow{letter-spacing:2px;font-size:12px;font-weight:750;text-transform:uppercase}.panel,.card{background:white;border:1px solid #e0ebe6;border-radius:19px;padding:23px;box-shadow:0 8px 26px #1a51410a}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role{background:#f4f9f6;color:#16483e;text-align:left;min-height:120px;border:1px solid #d7e8df}.role b{display:block;font-size:18px;margin:10px 0 4px}.role small{font-weight:400;line-height:1.5}.role:hover{background:#e0f2e9}.muted{color:#63766f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat strong{display:block;font-size:32px;color:#006c55}.stat small{color:#63766f}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:190px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card h3{margin:12px 0 7px}.card p{color:#5b7168;font-size:14px;line-height:1.6}.iconbox{height:110px;border-radius:12px;background:linear-gradient(120deg,#e2f4eb,#d7e9f2);display:grid;place-items:center;font-size:44px}.pill{display:inline-block;background:#e7f4ed;color:#00654f;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:700;margin:3px 4px 3px 0}.pill.orange{background:#fff2db;color:#956000}.pill.blue{background:#e9efff;color:#3655a0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{font-size:12px;padding:9px 11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:13px;font-weight:650}.field input,.field select,.field textarea,.toolbar input,.toolbar select{padding:12px;border:1px solid #d4e2db;border-radius:10px;background:#fff;color:#17382f;width:100%}textarea{min-height:85px}.notice{padding:13px;background:#fff7e8;border-radius:10px;color:#78561d;font-size:13px}.line{border-bottom:1px solid #e5eee9;padding:14px 0}.line:last-child{border:0}footer{text-align:center;padding:35px;color:#657b73;font-size:12px}@media(max-width:850px){.hero,.split{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards,.roles{grid-template-columns:1fr}.heroText{padding:27px}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div><strong>AIU / Innovation Hub</strong><br><span>School of Computing & Emerging Technologies · Independent concept demo</span></div><nav><button class="secondary" onclick="go('home')">Home</button><button class="secondary" onclick="go('visitor')">Explore projects</button><button class="ghost" onclick="go('home')">Switch role</button></nav></header><main id="app"></main><footer>Concept prototype for discussion with AIU · Fictional records · No institutional endorsement or real payments</footer><script>
const seedStudents=[{id:1,name:'Amina Otieno',number:'AIU-DEMO-101',email:'amina@example.test',github:'amina-demo',status:'approved'},{id:2,name:'Brian Mwangi',number:'AIU-DEMO-102',email:'brian@example.test',github:'brian-demo',status:'pending'},{id:3,name:'Faith Wanjiku',number:'AIU-DEMO-103',email:'faith@example.test',github:'faith-demo',status:'pending'},{id:4,name:'David Kiptoo',number:'AIU-DEMO-104',email:'david@example.test',github:'david-demo',status:'approved'}];
const seedProjects=[{id:1,student:1,title:'Smart Attendance',category:'Education',type:'Web application',description:'Digital class attendance, reporting and lecturer insights.',icon:'📚',status:'published',sale:true,consent:true,feedback:'Excellent practical implementation.',github:'https://github.com',live:'https://example.com'},{id:2,student:4,title:'AgriSense',category:'Agriculture',type:'IoT dashboard',description:'Crop monitoring and agricultural analytics for small farms.',icon:'🌱',status:'published',sale:false,consent:false,feedback:'Approved for publication.',github:'https://github.com',live:'https://example.com'},{id:3,student:1,title:'Campus Market',category:'E-commerce',type:'Marketplace',description:'A student-to-student marketplace for campus essentials.',icon:'🛒',status:'improve',sale:false,consent:false,feedback:'Improve mobile checkout and input validation.',github:'https://github.com',live:'https://example.com'},{id:4,student:4,title:'HealthLink',category:'Healthcare',type:'Web application',description:'Appointment scheduling concept for community clinics.',icon:'🩺',status:'pending',sale:false,consent:false,feedback:'',github:'https://github.com',live:'https://example.com'},{id:5,student:1,title:'Developer Portfolio',category:'Portfolio',type:'Portfolio',description:'A responsive personal portfolio with project case studies.',icon:'💻',status:'approved',sale:false,consent:false,feedback:'Ready to publish.',github:'https://github.com',live:'https://example.com'}];
const state={students:structuredClone(seedStudents),projects:structuredClone(seedProjects),lecturers:[{name:'Dr. Grace Njeri',email:'lecturer@demo.test'}],enquiries:[],role:'',student:1};let view='home',selected=1;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),student=id=>state.students.find(s=>s.id===id),status=x=>'<span class="pill '+(x==='improve'?'orange':x==='pending'?'blue':'')+'">'+esc(x)+'</span>',stats=items=>'<div class="stats">'+items.map(([k,v])=>'<div class="card stat"><strong>'+v+'</strong><small>'+k+'</small></div>').join('')+'</div>',field=(label,id,type='text',value='')=>'<label class="field">'+label+'<input id="'+id+'" type="'+type+'" value="'+esc(value)+'" required></label>',projectCard=p=>'<article class="card"><div class="iconbox">'+esc(p.icon)+'</div><h3>'+esc(p.title)+'</h3><span class="pill">'+esc(p.category)+'</span>'+status(p.status)+(p.sale&&p.consent?'<span class="pill orange">For sale</span>':'')+'<p>'+esc(p.description)+'</p><small class="muted">By '+esc(student(p.student)?.name||'Student')+'</small><div class="actions"><button onclick="detail('+p.id+')">View project</button></div></article>';
function go(v){view=v;render();window.scrollTo(0,0)}function detail(id){selected=id;go('detail')}function render(){let html='';if(view==='home')html='<section class="hero"><div class="heroText"><div class="eyebrow">Build · Verify · Publish · Discover</div><h1>Student innovation deserves to be seen.</h1><p>One destination for AIU student portfolios, live applications and university-reviewed innovation. Connect academic work to professional opportunity.</p><button onclick="go(\'visitor\')" style="background:white;color:#006c55">Explore student projects</button></div><div class="panel"><h2>Continue to your workspace</h2><p class="muted">Choose how you want to experience the platform.</p><div class="roles"><button class="role" onclick="go(\'lecturerLogin\')">▣<b>Lecturer</b><small>Verify students, review projects and recommend work for sale</small></button><button class="role" onclick="go(\'studentGate\')">⌘<b>Student</b><small>Verify enrolment, connect GitHub and showcase projects</small></button><button class="role" onclick="go(\'visitor\')">◉<b>Visitor</b><small>Browse published projects and enquire about innovations</small></button><button class="role" onclick="go(\'adminLogin\')">⚙<b>Administrator</b><small>Create lecturer accounts and oversee activity</small></button></div></div></section>'+stats([['Demo student profiles',state.students.length],['Projects submitted',state.projects.length],['Published projects',state.projects.filter(p=>p.status==='published').length],['For sale',state.projects.filter(p=>p.sale&&p.consent&&p.status==='published').length]])+'<h2>Featured innovations</h2><div class="cards">'+state.projects.filter(p=>p.status==='published').map(projectCard).join('')+'</div>';
if(view==='visitor'){html='<h1>Explore student innovations</h1><p class="muted">Discover published systems, portfolios and projects available for acquisition enquiries.</p><div class="toolbar"><input id="q" placeholder="Search project title or description" oninput="filterProjects()"><select id="cat" onchange="filterProjects()"><option value="">All categories</option>'+[...new Set(state.projects.map(p=>p.category))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select id="saleFilter" onchange="filterProjects()"><option value="">All projects</option><option value="sale">For sale</option></select></div><div id="results" class="cards"></div>';}
if(view==='detail'){let p=state.projects.find(x=>x.id===selected);html='<button class="secondary" onclick="go(\'visitor\')">← Back to directory</button><div class="split" style="margin-top:18px"><section class="panel"><div class="iconbox">'+esc(p.icon)+'</div><h1>'+esc(p.title)+'</h1>'+status(p.status)+'<p>'+esc(p.description)+'</p><p><b>Category:</b> '+esc(p.category)+' · <b>Type:</b> '+esc(p.type)+'</p><p><b>Student:</b> '+esc(student(p.student)?.name)+'</p><div class="actions"><a class="btn" href="'+esc(p.live)+'" target="_blank" rel="noopener noreferrer">Live demo</a><a class="btn" href="'+esc(p.github)+'" target="_blank" rel="noopener noreferrer">Repository</a></div><p class="notice">External links in seeded projects are placeholders, not working student systems.</p></section><section class="panel"><h2>Project acquisition enquiry</h2><p class="muted">Submit a non-binding enquiry. This demo stores information only in browser memory.</p>'+(p.sale&&p.consent?'<form onsubmit="enquire(event)">'+field('Your name','buyer')+field('Email address','buyerEmail','email')+'<label class="field">Interested in<select id="asset"><option>Live system</option><option>Source code</option><option>Project proposal</option></select></label><label class="field">Message<textarea id="buyerMsg" required></textarea></label><button>Send demo enquiry</button></form>':'<p class="notice">This project is not listed for sale.</p>')+'</section></div>';}
if(view==='studentGate')html='<div class="split"><section class="panel"><h1>Student onboarding</h1><p>First request student verification. A lecturer must approve before you can complete GitHub onboarding.</p><form onsubmit="requestVerification(event)">'+field('Full name','newName')+field('Student registration number','newNumber')+field('Email','newEmail','email')+'<button>Submit verification request</button></form></section><section class="panel"><h2>Already verified?</h2><p class="muted">Select a fictional approved student to demonstrate the GitHub connection and student dashboard.</p><label class="field">Demo student<select id="studentSelect">'+state.students.filter(s=>s.status==='approved').map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></label><button onclick="connectDemo()">Continue with GitHub (demo)</button><p class="notice">Simulated GitHub connection. No real OAuth or account creation occurs.</p></section></div>';
if(view==='student'){let s=student(state.student),ps=state.projects.filter(p=>p.student===s.id);html='<h1>Student dashboard</h1><p class="muted">Welcome, '+esc(s.name)+' · '+esc(s.number)+' · GitHub: '+esc(s.github||'Not connected')+'</p>'+stats([['My projects',ps.length],['Published',ps.filter(p=>p.status==='published').length],['Needs improvement',ps.filter(p=>p.status==='improve').length],['Recommended for sale',ps.filter(p=>p.sale).length]])+'<div class="split"><section class="panel"><h2>Submit a project</h2><form onsubmit="submitProject(event)">'+field('Project title','projectTitle')+'<label class="field">Category<select id="projectCat"><option>Portfolio</option><option>Education</option><option>Agriculture</option><option>Healthcare</option><option>FinTech</option><option>E-commerce</option><option>AI / ML</option><option>Other</option></select></label>'+field('Project type','projectType')+field('Project icon (emoji or text)','projectIcon','text','💻')+'<label class="field">Description<textarea id="projectDesc" required></textarea></label>'+field('GitHub URL','projectGit','url','https://github.com/')+field('Live URL','projectLive','url','https://example.com')+'<button>Submit for lecturer review</button></form></section><section class="panel"><h2>My submissions</h2>'+ps.map(p=>'<div class="line"><b>'+esc(p.title)+'</b> '+status(p.status)+(p.sale?'<span class="pill orange">Recommended for sale</span>':'')+'<p class="muted">'+esc(p.feedback||'Awaiting lecturer feedback')+'</p><div class="actions">'+(p.status==='approved'?'<button onclick="changeProject('+p.id+',\'published\')">Publish project</button>':'')+(p.status==='improve'?'<button onclick="resubmit('+p.id+')">Resubmit for review</button>':'')+(p.sale&&!p.consent?'<button onclick="consentSale('+p.id+')">Consent to sale listing</button>':'')+(p.sale&&p.consent?'<span class="pill">Sale listing consent recorded</span>':'')+'</div></div>').join('')+'</section></div>';}
if(view==='lecturerLogin'||view==='adminLogin')html='<section class="panel" style="max-width:520px;margin:30px auto"><h1>'+ (view==='lecturerLogin'?'Lecturer':'Administrator')+' sign-in</h1><p class="notice">Demonstration access only. Enter any nonempty credentials. No authentication is performed.</p><form onsubmit="event.preventDefault();go(\''+(view==='lecturerLogin'?'lecturer':'admin')+'\')">'+field('Email','loginEmail','email')+field('Password','loginPassword','password')+'<button>Enter demo dashboard</button></form></section>';
if(view==='lecturer'){let pending=state.students.filter(s=>s.status==='pending'),review=state.projects.filter(p=>p.status==='pending'||p.status==='improve');html='<h1>Lecturer dashboard</h1><p class="muted">Review student verification, project submissions, publication readiness and sale recommendations.</p>'+stats([['Students awaiting verification',pending.length],['Projects approved',state.projects.filter(p=>['approved','published'].includes(p.status)).length],['Recommended for sale',state.projects.filter(p=>p.sale).length],['Projects needing improvement',state.projects.filter(p=>p.status==='improve').length]])+'<div class="split"><section class="panel"><h2>Student verification queue</h2>'+(pending.map(s=>'<div class="line"><b>'+esc(s.name)+'</b><p class="muted">'+esc(s.number)+' · '+esc(s.email)+'</p><div class="actions"><button onclick="verify('+s.id+',\'approved\')">Verify student</button><button class="ghost" onclick="verify('+s.id+',\'rejected\')">Reject</button></div></div>').join('')||'<p class="muted">No pending requests.</p>')+'</section><section class="panel"><h2>Project review queue</h2>'+(review.map(p=>'<div class="line"><b>'+esc(p.title)+'</b> '+status(p.status)+'<p class="muted">'+esc(student(p.student)?.name)+' · '+esc(p.description)+'</p><label class="field">Lecturer comment<textarea id="comment'+p.id+'">'+esc(p.feedback)+'</textarea></label><div class="actions"><button onclick="reviewProject('+p.id+',\'approved\')">Approve</button><button class="ghost" onclick="reviewProject('+p.id+',\'improve\')">Request improvements</button></div></div>').join('')||'<p class="muted">No projects awaiting review.</p>')+'</section></div><section class="panel" style="margin-top:18px"><h2>All projects and sale recommendations</h2>'+state.projects.map(p=>'<div class="line"><b>'+esc(p.title)+'</b> · '+esc(student(p.student)?.name)+' '+status(p.status)+(p.sale?'<span class="pill orange">Recommended for sale</span>':'')+'<div class="actions">'+(['approved','published'].includes(p.status)&&!p.sale?'<button onclick="recommend('+p.id+')">Recommend for sale</button>':'')+'</div></div>').join('')+'</section>';}
if(view==='admin')html='<h1>Administrator dashboard</h1><p class="muted">Platform governance, lecturer onboarding and demonstration activity.</p>'+stats([['Lecturer accounts',state.lecturers.length],['Students',state.students.length],['Projects',state.projects.length],['Purchase enquiries',state.enquiries.length]])+'<div class="split"><section class="panel"><h2>Create lecturer account</h2><form onsubmit="createLecturer(event)">'+field('Lecturer full name','lecturerName')+field('Lecturer email','lecturerEmail','email')+'<button>Create demo lecturer</button></form><p class="notice">Production requires an authenticated admin and a secure invitation workflow.</p></section><section class="panel"><h2>Lecturer accounts</h2>'+state.lecturers.map(l=>'<div class="line"><b>'+esc(l.name)+'</b><p class="muted">'+esc(l.email)+'</p></div>').join('')+'<h2>Purchase enquiries</h2>'+(state.enquiries.map(e=>'<div class="line"><b>'+esc(e.buyer)+'</b> · '+esc(e.asset)+'<p class="muted">'+esc(e.email)+' · '+esc(e.title)+'</p></div>').join('')||'<p class="muted">No enquiries yet.</p>')+'</section></div>';
$('app').innerHTML=html;if(view==='visitor')filterProjects()}
function filterProjects(){let q=$('q').value.toLowerCase(),cat=$('cat').value,sale=$('saleFilter').value;let p=state.projects.filter(p=>p.status==='published'&&(!cat||p.category===cat)&&(!sale||(p.sale&&p.consent))&&(p.title+' '+p.description+' '+p.category).toLowerCase().includes(q));$('results').innerHTML=p.map(projectCard).join('')||'<p>No matching published projects.</p>'}
function requestVerification(e){e.preventDefault();let number=$('newNumber').value.trim();if(state.students.some(s=>s.number.toLowerCase()===number.toLowerCase()))return alert('This demo student number already exists.');state.students.push({id:Date.now(),name:$('newName').value.trim(),number,email:$('newEmail').value.trim(),github:'',status:'pending'});alert('Demo verification request submitted. Switch to Lecturer to approve it.');go('home')}
function connectDemo(){let id=Number($('studentSelect').value);if(!id)return alert('No verified students yet.');state.student=id;student(id).github||='github-demo-user';go('student')}
function submitProject(e){e.preventDefault();state.projects.push({id:Date.now(),student:state.student,title:$('projectTitle').value,category:$('projectCat').value,type:$('projectType').value,icon:$('projectIcon').value,description:$('projectDesc').value,github:$('projectGit').value,live:$('projectLive').value,status:'pending',sale:false,consent:false,feedback:''});go('student')}
function verify(id,status){student(id).status=status;render()}function reviewProject(id,status){let p=state.projects.find(x=>x.id===id);p.feedback=$('comment'+id).value;p.status=status;render()}function changeProject(id,status){state.projects.find(p=>p.id===id).status=status;render()}function resubmit(id){let p=state.projects.find(p=>p.id===id);p.status='pending';p.feedback='Resubmitted for lecturer review.';render()}function recommend(id){state.projects.find(p=>p.id===id).sale=true;render()}function consentSale(id){state.projects.find(p=>p.id===id).consent=true;render()}function createLecturer(e){e.preventDefault();state.lecturers.push({name:$('lecturerName').value,email:$('lecturerEmail').value});render()}function enquire(e){e.preventDefault();let p=state.projects.find(x=>x.id===selected);state.enquiries.push({title:p.title,buyer:$('buyer').value,email:$('buyerEmail').value,asset:$('asset').value,message:$('buyerMsg').value});alert('Demo enquiry recorded. No email or payment was sent.');go('visitor')}render();
</script></body></html>
