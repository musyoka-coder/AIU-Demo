/* ---------- STUDENT ---------- */
function sGate(){
 return '<div class="two" style="grid-template-columns:1fr 1fr"><div class="panel"><div class="eyebrow" style="color:var(--red)">New student</div><h2 style="margin:8px 0">Request verification</h2><p style="color:#666">A lecturer must confirm your enrolment before you can onboard.</p><div class="fld">Full name<input id="nn"></div><div class="fld">Registration number<input id="nr"></div><div class="fld">Email<input id="ne" type="email"></div><button class="btn" onclick="reqV()">Submit request</button></div><div class="panel"><div class="eyebrow" style="color:var(--red)">Returning student</div><h2 style="margin:8px 0">Sign in with GitHub (demo)</h2><p style="color:#666">Pick a demo student. Waiting students will see the pending screen.</p><div class="fld">Demo student<select id="ss">'+state.students.map(s=>'<option value="'+s.id+'">'+e(s.name)+' · '+s.status+'</option>').join('')+'</select></div><button class="btn dark" onclick="ui.sid=Number(ss.value);go(\'student\')">Continue with GitHub</button><div class="note" style="margin-top:14px">Simulated sign-in. No real OAuth occurs.</div></div></div>';
}
function reqV(){if(!nn.value.trim()||!nr.value.trim()){toast('Name and registration number required');return}const id=Date.now();state.students.push({id,name:nn.value.trim(),reg:nr.value.trim(),email:ne.value,github:'',status:'pending',date:'Today',course:'BSc Information Technology'});log(nn.value.trim()+' requested verification');ui.sid=id;toast('Request submitted. A lecturer will verify you.');go('student')}
function studentView(){
 const s=stu(ui.sid),ps=state.projects.filter(p=>p.student===s.id);
 if(s.status!=='verified')return '<div class="center"><div class="panel" style="text-align:center"><div style="font-size:50px">'+(s.status==='pending'?'⏳':'⛔')+'</div><h2 style="margin:10px 0">'+(s.status==='pending'?'Verification pending':'Verification rejected')+'</h2><p style="color:#666">'+(s.status==='pending'?'Hello '+e(s.name)+'. A lecturer is reviewing your request. You will be able to submit projects once verified.':'Your request was rejected. Contact your lecturer to correct your details.')+'</p><div style="margin-top:18px"><button class="btn dark" onclick="go(\'studentGate\')">Back</button></div><div class="note" style="margin-top:14px">Demo tip: sign in as Lecturer and verify this student.</div></div></div>';
 return '<div class="ph"><div><h1>Welcome, '+e(s.name.split(' ')[0])+'</h1><p>'+e(s.reg)+' · '+e(s.course)+' · GitHub: '+(s.github?'@'+e(s.github):'<button class="btn sm line" onclick="gh()">Connect GitHub</button>')+'</p></div><button class="btn" '+(state.policy.studentSubmit?'':'disabled')+' onclick="subM()">+ Submit a project</button></div><div class="kpis" style="margin-bottom:18px"><div class="kpi"><b>'+ps.length+'</b><span>My projects</span></div><div class="kpi k4"><b>'+ps.filter(p=>p.status==='published').length+'</b><span>Published</span></div><div class="kpi k3"><b>'+ps.filter(p=>p.status==='improve').length+'</b><span>Need improvement</span></div><div class="kpi k2"><b>'+ps.filter(p=>p.sale).length+'</b><span>Recommended for sale</span></div></div><div class="panel"><h3>My projects</h3>'+(ps.map(p=>'<div class="row"><div class="ic">'+p.icon+'</div><div class="mid"><b>'+e(p.title)+' '+pillS(p.status)+'</b><small>'+e(p.cat)+' · '+e(p.type)+'</small>'+(p.feedback?'<div class="fb">Lecturer: '+e(p.feedback)+'</div>':'<small>Awaiting lecturer feedback</small>')+(p.sale?'<div class="note" style="margin-top:6px">Your lecturer recommended this for sale at '+kes(p.price)+'. '+(p.consent?'You have consented.':'Your consent is required before it is listed.')+'</div>':'')+'</div><div class="act">'+(p.status==='approved'?'<button class="btn sm" onclick="pubP('+p.id+')">Publish</button>':'')+(p.status==='improve'?'<button class="btn sm" onclick="resub('+p.id+')">Resubmit</button>':'')+(p.sale&&!p.consent?'<button class="btn sm ok" onclick="cons('+p.id+')">Consent to sale</button>':'')+'</div></div>').join('')||'<div class="empty">No projects yet. Submit your first one.</div>')+'</div>';
}
function gh(){stu(ui.sid).github=stu(ui.sid).name.split(' ')[0].toLowerCase()+'-dev';toast('GitHub connected (simulated)');render()}
function subM(){modal('<h2>Submit a project</h2><div class="fld">Title<input id="st"></div><div class="fld">Category<select id="sc">'+CATS.map(c=>'<option>'+e(c)+'</option>').join('')+'</select></div><div class="fld">Type<input id="sy" placeholder="e.g. Web application"></div><div class="fld">Description<textarea id="sd"></textarea></div><div class="fld">GitHub URL<input id="sg" value="https://github.com/"></div><button class="btn" onclick="subS()">Submit for lecturer review</button>')}
function subS(){if(!st.value.trim()){toast('Title required');return}state.projects.unshift({id:Date.now(),title:st.value.trim(),cat:sc.value,type:sy.value||'Web application',icon:'💡',desc:sd.value||'No description.',status:'pending',sale:false,consent:false,price:0,student:ui.sid,stack:['Web'],feedback:'',date:'Today',views:0});log(stu(ui.sid).name+' submitted "'+st.value.trim()+'"');closeM();toast('Submitted for review');render()}
function pubP(id){if(!state.policy.selfPublish){toast('Self-publishing is disabled by the administrator');return}const p=prj(id);p.status='published';log('"'+p.title+'" published');toast('Published to the directory');render()}
function resub(id){const p=prj(id);p.status='pending';p.feedback='';toast('Resubmitted for review');render()}
function cons(id){const p=prj(id);p.consent=true;log('Student consented to sale of "'+p.title+'"');toast('Consent recorded. Listed in Buy Systems once published.');render()}
/* ---------- ADMIN ---------- */
function admin(){
 const nav=[['ov','▦','Overview'],['users','☺','Users'],['perm','🔐','Permissions',state.reqs.filter(r=>r.status==='pending').length||''],['enq','✉','Enquiries'],['aud','≡','Audit log']];
 const B={ov:aOv,users:aUsers,perm:aPerm,enq:aEnq,aud:aAud}[ui.apage]();
 return '<div class="shell">'+side(nav,ui.apage,'ap','Platform Admin','Overall control')+'<section>'+B+'</section></div>';
}
function ap(p){ui.apage=p;render();window.scrollTo(0,0)}
function aOv(){return '<div class="ph"><div><h1>Administrator overview</h1><p>Full oversight of users, permissions, content and activity.</p></div></div><div class="kpis"><div class="kpi"><b>'+state.lecturers.filter(l=>l.active).length+'</b><span>Active lecturers</span></div><div class="kpi k2"><b>'+state.students.length+'</b><span>Students</span></div><div class="kpi k4"><b>'+state.projects.length+'</b><span>Projects</span></div><div class="kpi k3"><b>'+state.reqs.filter(r=>r.status==='pending').length+'</b><span>Permission requests</span></div><div class="kpi"><b>'+state.enquiries.length+'</b><span>Buyer enquiries</span></div></div><div class="two"><div class="panel"><h3>Projects by category</h3>'+bars(CATS.map(c=>[c,state.projects.filter(p=>p.cat===c).length]),6,'d')+'</div><div class="panel"><h3>Latest activity</h3>'+state.log.slice(0,7).map(l=>'<div class="row" style="padding:10px 0"><div class="mid">'+e(l[0])+'</div><small style="color:#888">'+e(l[1])+'</small></div>').join('')+'</div></div>'}
function aUsers(){return '<div class="ph"><div><h1>Users</h1><p>Create lecturer accounts and manage access.</p></div><button class="btn" onclick="lecM()">+ Create lecturer</button></div><div class="two" style="grid-template-columns:1fr 1fr"><div class="panel"><h3>Lecturers</h3>'+state.lecturers.map(l=>'<div class="row"><div class="av">'+ini(l.name.replace(/^(Dr\.|Mr\.|Ms\.)\s/,''))+'</div><div class="mid"><b>'+e(l.name)+' <span class="pill '+(l.active?'ok':'dark')+'">'+(l.active?'Active':'Suspended')+'</span></b><small>'+e(l.email)+' · '+e(l.dept)+'</small></div><div class="act"><button class="btn sm line" onclick="tgl('+l.id+')">'+(l.active?'Suspend':'Activate')+'</button></div></div>').join('')+'</div><div class="panel"><h3>Students</h3>'+state.students.slice(0,8).map(s=>'<div class="row"><div class="av r">'+ini(s.name)+'</div><div class="mid"><b>'+e(s.name)+' <span class="pill '+(s.suspended?'dark':s.status==='verified'?'ok':'warn')+'">'+(s.suspended?'Suspended':s.status)+'</span></b><small>'+e(s.reg)+'</small></div><div class="act"><button class="btn sm line" onclick="sus('+s.id+')">'+(s.suspended?'Restore':'Suspend')+'</button></div></div>').join('')+'<div class="by" style="margin-top:10px">Showing 8 of '+state.students.length+'</div></div></div>'}
function lecM(){modal('<h2>Create lecturer account</h2><div class="fld">Full name<input id="ln"></div><div class="fld">Email<input id="le" type="email"></div><div class="fld">Department<input id="ld" value="SCET"></div><div class="note">In production an invitation email with a secure set-password link would be sent.</div><button class="btn" style="margin-top:14px" onclick="lecS()">Create account</button>')}
function lecS(){if(!ln.value.trim()||!le.value.trim()){toast('Name and email required');return}state.lecturers.push({id:Date.now(),name:ln.value.trim(),email:le.value.trim(),dept:ld.value,active:true});log('Admin created lecturer account for '+ln.value.trim());closeM();toast('Lecturer created (demo)');render()}
function tgl(id){const l=state.lecturers.find(x=>x.id===id);l.active=!l.active;log('Admin '+(l.active?'activated ':'suspended ')+l.name);render()}
function sus(id){const s=stu(id);s.suspended=!s.suspended;log('Admin '+(s.suspended?'suspended ':'restored ')+s.name);render()}
function aPerm(){const P=state.policy,T=[['selfPublish','Students can self-publish approved projects','Turn off to require lecturer publishing.'],['studentSubmit','Students can submit new projects','Pause all new submissions.'],['saleListing','Buy Systems listings enabled','Hide the whole marketplace instantly.'],['enquiries','Visitor enquiries enabled','Allow visitors to contact about systems.'],['autoReminders','Weekly review reminders to lecturers','Email lecturers about pending items.']];
 return '<div class="ph"><div><h1>Permissions</h1><p>Approve access requests and set platform-wide policies.</p></div></div><div class="two" style="grid-template-columns:1.1fr 1fr"><div class="panel"><h3>Permission requests</h3>'+state.reqs.map(r=>'<div class="row"><div class="mid"><b>'+e(r.req)+' <span class="pill '+(r.status==='pending'?'blue':r.status==='approved'?'ok':'dark')+'">'+r.status+'</span></b><small>'+e(r.who)+' ('+e(r.role)+')</small><div class="by">'+e(r.detail)+'</div></div>'+(r.status==='pending'?'<div class="act"><button class="btn sm ok" onclick="rq('+r.id+',\'approved\')">Approve</button><button class="btn sm line" onclick="rq('+r.id+',\'denied\')">Deny</button></div>':'')+'</div>').join('')+'</div><div class="panel"><h3>Platform policies</h3>'+T.map(t=>'<div class="tog"><div><b>'+t[1]+'</b><small>'+t[2]+'</small></div><button class="sw '+(P[t[0]]?'on':'')+'" onclick="pol(\''+t[0]+'\')"></button></div>').join('')+'</div></div>'}
function rq(id,s){const r=state.reqs.find(x=>x.id===id);r.status=s;log('Admin '+s+' request: '+r.req+' ('+r.who+')');toast('Request '+s);render()}
function pol(k){state.policy[k]=!state.policy[k];log('Admin changed policy: '+k+' = '+(state.policy[k]?'on':'off'));render()}
function aEnq(){return '<div class="ph"><div><h1>Buyer enquiries</h1><p>Everything visitors have asked about.</p></div></div><div class="panel">'+state.enquiries.map(q=>'<div class="row"><div class="av">'+ini(q.name)+'</div><div class="mid"><b>'+e(q.name)+' · '+e(q.org||'Individual')+'</b><small>'+e(q.email)+' · '+e(prj(q.pid)?.title)+' · '+e(q.asset)+' · '+e(q.date)+'</small><div class="by" style="margin-top:4px">'+e(q.msg)+'</div></div></div>').join('')+'</div>'}
function aAud(){return '<div class="ph"><div><h1>Audit log</h1><p>Every important action, in order.</p></div></div><div class="panel">'+state.log.map(l=>'<div class="row" style="padding:11px 0"><div class="mid">'+e(l[0])+'</div><small style="color:#888">'+e(l[1])+'</small></div>').join('')+'</div>'}
render();
</script></body></html>
